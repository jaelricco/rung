name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /srv/calisthenics
            git fetch --all
            git reset --hard origin/main
            docker compose up -d --build --remove-orphans
            docker image prune -f
            # Fail the job if anything did not come up healthy.
            sleep 15
            docker compose ps
            docker compose exec -T api wget -qO- http://127.0.0.1:8080/healthz >/dev/null || \
              (docker compose logs --tail=50 api && exit 1)
