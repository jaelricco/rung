# One workflow, four stages: check, build images, deploy, verify.
#
# It is deliberately a single workflow rather than CI + a separate deploy
# triggered by workflow_run. A workflow_run deploy starts a *new* run with its
# own checkout of the default branch, which means the thing you deployed and
# the thing CI proved green were only related by timing. Here the deploy job
# `needs:` the jobs that proved the commit, and ships the exact image digest
# those jobs produced.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # Superseded runs on the same branch are pointless — except on main, where
  # cancelling mid-deploy would leave the server half-updated.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io

jobs:
  backend:
    name: Go build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - name: Build, vet and test
        working-directory: backend
        # One step, teed to a file. The failure report below reads that file:
        # a sandbox with no route to the log storage host cannot read an
        # Actions log, so the transcript has to travel through the API.
        #
        # `go mod verify` rather than `go mod tidy`: go.sum and the indirect
        # requirements are committed, so a build resolves nothing. If this
        # fails, an import was added without running `go mod tidy`.
        run: |
          set -o pipefail
          {
            echo "== go mod download && verify"; go mod download && go mod verify
            echo "== go build";                  go build -v ./...
            echo "== go vet";                    go vet ./...
            echo "== go test";                   go test ./...
          } 2>&1 | tee "$RUNNER_TEMP/backend.log"

      - name: Report the failure
        if: failure()
        uses: ./.github/actions/report
        with:
          title: "go build failed"
          file: ${{ runner.temp }}/backend.log
          token: ${{ github.token }}

  frontend:
    name: SvelteKit build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build
        working-directory: frontend
        run: |
          set -o pipefail
          {
            npm install --no-audit --no-fund
            npm run build
          } 2>&1 | tee "$RUNNER_TEMP/frontend.log"

      - name: Report the failure
        if: failure()
        uses: ./.github/actions/report
        with:
          title: "svelte build failed"
          file: ${{ runner.temp }}/frontend.log
          token: ${{ github.token }}

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose.yaml
        env:
          POSTGRES_PASSWORD: ci-placeholder
          APP_DOMAIN: ci.example.com
          ACME_EMAIL: ci@example.com
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet
      - name: Shellcheck the deploy scripts
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning infra/*.sh bin/deploy bin/ops bin/lib.sh 2>&1 \
            | tee "$RUNNER_TEMP/compose.log"

      - name: Report the failure
        if: failure()
        uses: ./.github/actions/report
        with:
          title: "compose or shellcheck failed"
          file: ${{ runner.temp }}/compose.log
          token: ${{ github.token }}

  images:
    name: Build and push images
    needs: [backend, frontend, compose]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        # The commit SHA is the release identifier everywhere downstream: the
        # image tag, the value written into the server's .env, and what a
        # rollback names. `latest` is also pushed, but only ever as a
        # convenience for a fresh server — deploys never resolve it.
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: api
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/api:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository }}/api:latest
          # Layer cache lives in the registry, so a runner that has never seen
          # this repo still skips unchanged layers. Without it every deploy
          # recompiles the whole Go module graph.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/api:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/api:buildcache,mode=max

      - name: web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/web:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository }}/web:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/web:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/web:buildcache,mode=max

  deploy:
    name: Deploy
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
    concurrency:
      # One deploy at a time, and never cancel one halfway through.
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Check whether a server is configured
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          # The `secrets` context is not available in an `if:` expression, so
          # the presence of each one becomes a step output instead.
          if [ -z "$DEPLOY_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_HOST is not set, so there is nothing to deploy to yet. The images were pushed and are ready."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$APP_DOMAIN" ]; then
            echo "domain=false" >> "$GITHUB_OUTPUT"
          else
            echo "domain=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy ${{ needs.images.outputs.tag }}
        id: remote
        if: steps.check.outputs.configured == 'true'
        uses: ./.github/actions/remote
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          env: |
            TAG='${{ needs.images.outputs.tag }}'
            BRANCH='${{ github.ref_name }}'
            GHCR_USER='${{ github.actor }}'
            GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}'
          script: |
            cd /srv/calisthenics
            # The server still tracks the repo, but only for the things that
            # are read at runtime rather than built: compose.yaml, Caddyfile,
            # the Makefile and these scripts.
            git fetch --all --prune -q
            git reset --hard -q "origin/${BRANCH:-main}"
            # A run-scoped token, so no registry credential is left behind.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
            bash infra/deploy.sh "$TAG"
            docker logout ghcr.io >/dev/null 2>&1 || true

      - name: Check the site from outside
        if: steps.check.outputs.configured == 'true' && steps.check.outputs.domain == 'true'
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          # The health check inside the deploy proves the containers are up.
          # This proves Caddy, TLS and DNS still agree with them.
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://$APP_DOMAIN/healthz" || echo 000)
            if [ "$code" = "200" ]; then
              echo "https://$APP_DOMAIN/healthz -> 200"
              exit 0
            fi
            echo "attempt $i: $code"
            sleep 6
          done
          echo "::error::the site did not answer 200 on /healthz after the deploy"
          exit 1

      - name: Report
        if: always() && steps.check.outputs.configured == 'true'
        uses: ./.github/actions/report
        with:
          title: "deploy `${{ needs.images.outputs.tag }}`"
          outcome: ${{ steps.remote.outcome }}
          file: /tmp/remote-output.txt
          token: ${{ github.token }}
