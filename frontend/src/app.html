<!doctype html>
<!-- The markup ships in the dark palette, which is what this app looked like
     before there was a choice. The script below replaces it with whatever the
     athlete asked for, or with what their system asks for, before the first
     paint — so there is no flash of the wrong instrument. -->
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0A1012" />
		<link rel="icon" href="data:," />
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('rig-theme');
					var theme =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.dataset.theme = theme;
					document
						.querySelector('meta[name="theme-color"]')
						.setAttribute('content', theme === 'dark' ? '#0a1012' : '#f5f6f3');
				} catch (e) {
					/* Storage refused, or no matchMedia. The dark palette stands. */
				}
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<title>Training</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div>%sveltekit.body%</div>
	</body>
</html>
