# Production stack. Images are built in CI and pulled by tag — nothing is
# compiled on this machine. IMAGE_TAG is written into .env by infra/deploy.sh,
# so every ordinary compose command (logs, restart, ps) keeps using exactly the
# release that is currently live.
#
# To build locally instead of pulling:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build

name: calisthenics

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cali}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cali}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cali} -d ${POSTGRES_DB:-cali}"]
      interval: 5s
      timeout: 5s
      retries: 24

  api:
    image: ${API_IMAGE:-ghcr.io/jaelricco/rung/api}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cali}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cali}?sslmode=disable
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      AI_CREDENTIALS_KEY: ${AI_CREDENTIALS_KEY:-}
      AI_THINKING: ${AI_THINKING:-adaptive}
      WEB_SEARCH_TOOL_VERSION: ${WEB_SEARCH_TOOL_VERSION:-web_search_20250305}
      API_ADDR: ":8080"
      APP_ORIGIN: https://${APP_DOMAIN}
      APP_VERSION: ${IMAGE_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-ghcr.io/jaelricco/rung/web}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
    healthcheck:
      # Any response under 500 counts: the app may redirect an anonymous
      # request to /login, and that still proves the server is serving.
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set in .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web

volumes:
  db-data:
  caddy-data:
  caddy-config:
