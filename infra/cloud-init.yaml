#cloud-config
#
# Paste into the "Cloud config" field when CREATING a Hetzner server. It is read
# once, at creation, and cannot be added to a server that already exists — for
# those, use infra/bootstrap.sh instead.
#
# This file deliberately does almost nothing itself: it creates the deploy user,
# clones the repo, and hands over to infra/setup.sh, which is the single place
# server setup is defined. Keeping the logic in the repo means the two entry
# points can't drift apart.
#
# ─── EDIT THE VALUES IN /root/setup.env BELOW ────────────────────────────────
#
#   REPO_URL     https://github.com/you/calisthenics.git
#   APP_DOMAIN   the domain you'll point at this server
#   ACME_EMAIL   where Let's Encrypt sends expiry warnings
#   GIT_USER / GIT_TOKEN   only for a private repo, see the note below
#
# ─── ONE SECURITY NOTE ───────────────────────────────────────────────────────
# Everything here stays readable from inside the server at 169.254.169.254 for
# the life of the machine. Any process on the box can read it.
#
# So do NOT put your Anthropic API key here. The stack runs fine without it —
# coaching endpoints return 503 — and the login banner shows the one command to
# add it afterwards. The database password is generated on the machine and never
# passes through this file.
#
# For a private repo, use a GitHub fine-grained token with read-only Contents on
# that one repo and set GIT_USER="x-access-token", accepting that it is
# metadata-readable. Better: this repo holds no secrets, so make it public and
# leave both empty.

timezone: Europe/Zurich
package_update: true

packages:
  - git
  - ca-certificates
  - curl

users:
  - name: deploy
    # docker isn't a group yet at this stage — setup.sh adds it after install.
    groups: [sudo]
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']

write_files:
  - path: /root/setup.env
    permissions: '0600'
    content: |
      REPO_URL="https://github.com/YOU/YOUR-REPO.git"
      APP_DOMAIN="training.example.com"
      ACME_EMAIL="you@example.com"
      GIT_USER="x-access-token"
      GIT_TOKEN=""

  - path: /root/clone-and-setup.sh
    permissions: '0700'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      exec > >(tee -a /var/log/calisthenics-setup.log) 2>&1

      source /root/setup.env
      APP_DIR=/srv/calisthenics

      if [[ "$REPO_URL" == *YOUR-REPO* ]]; then
        echo "REPO_URL is still the placeholder. Fix /root/setup.env and rerun this script."
        exit 1
      fi

      # Copy the SSH key Hetzner injected into root across to deploy, before
      # setup.sh restricts root login.
      if [[ -f /root/.ssh/authorized_keys ]]; then
        install -d -m 700 -o deploy -g deploy /home/deploy/.ssh
        install -m 600 -o deploy -g deploy \
          /root/.ssh/authorized_keys /home/deploy/.ssh/authorized_keys
      fi

      CLONE_URL="$REPO_URL"
      if [[ -n "${GIT_TOKEN:-}" ]]; then
        # username:token form, which GitHub and GitLab both accept.
        CLONE_URL="${REPO_URL/https:\/\//https://${GIT_USER:-x-access-token}:$GIT_TOKEN@}"
      fi

      mkdir -p "$APP_DIR"
      chown deploy:deploy "$APP_DIR"
      if [[ ! -d "$APP_DIR/.git" ]]; then
        sudo -u deploy git clone "$CLONE_URL" "$APP_DIR"
      fi
      # Don't leave the token sitting in .git/config.
      sudo -u deploy git -C "$APP_DIR" remote set-url origin "$REPO_URL"

      exec bash "$APP_DIR/infra/setup.sh"

runcmd:
  - bash /root/clone-and-setup.sh

final_message: "Server ready after $UPTIME seconds. See /var/log/calisthenics-setup.log"
